name: Java Review

on:
  pull_request:

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: reviewdog/action-setup@v1

      - name: Run Checkstyle
        run: |
          wget https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.12.4/checkstyle-10.12.4-all.jar

          BASE_REF="${GITHUB_BASE_REF:-main}"
          git fetch origin "$BASE_REF" --depth=1 || true
          git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '*.java' > changed-java-files.txt

          if [ -s changed-java-files.txt ]; then
            mapfile -t java_files < changed-java-files.txt
            java -jar checkstyle-10.12.4-all.jar \
              -c .github/checkstyle.xml \
              -f xml \
              "${java_files[@]}" \
              > checkstyle-result.xml || true
          else
            echo '<?xml version="1.0"?><checkstyle version="10.0"></checkstyle>' > checkstyle-result.xml
          fi

          if [ ! -s checkstyle-result.xml ]; then
            echo '<?xml version="1.0"?><checkstyle version="10.0"></checkstyle>' > checkstyle-result.xml
          fi

      - name: Run Review Rules
        run: python3 .github/review_rules.py
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Reviewdog
        run: |
          reviewdog -f=checkstyle \
            -name="java-review" \
            -reporter=github-pr-review \
            -filter-mode=added \
            -level=warning \
            < checkstyle-result.xml
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
